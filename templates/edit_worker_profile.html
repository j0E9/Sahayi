<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Worker Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .profile-photo {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #ccc;
        }
        .skill-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .delete-btn {
            background: transparent;
            color: red;
            border: none;
        }
        .delete-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Edit Worker Profile</h2>

    <!-- Profile Photo -->
    <div class="text-center mb-4">
        <label for="photo">
            <img src="{{ url_for('static', filename='uploads/' + profile.photo) if profile.photo else url_for('static', filename='default-profile.jpg') }}"
                 class="profile-photo" id="photo-preview" alt="Profile Photo">
        </label>
    </div>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" id="photo" name="photo" accept="image/*" class="d-none" onchange="previewImage(event)">

        <div class="row g-3">
            <div class="col-md-6">
                <label>Age</label>
                <input type="number" class="form-control" name="age" value="{{ profile.age }}" required>
            </div>
            <div class="col-md-6">
                <label>Phone</label>
                <input type="text" class="form-control" name="phone" value="{{ profile.phone }}" required>
            </div>

            <div class="col-md-6">
                <label>Gender</label>
                <select class="form-select" name="gender" required>
                    <option value="Male" {% if profile.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if profile.gender == 'Female' %}selected{% endif %}>Female</option>
                </select>
            </div>
            <div class="col-md-6">
                <label>Qualification</label>
                <input type="text" class="form-control" name="qualification" value="{{ profile.qualification }}" required>
            </div>

            <div class="col-md-12">
                <label>Experience</label>
                <input type="text" class="form-control" name="experience" value="{{ profile.experience }}" required>
            </div>

            <div class="col-md-12">
                <label>About Me</label>
                <textarea class="form-control" name="about" rows="3" required>{{ profile.about }}</textarea>
            </div>
        </div>

        <hr class="my-4">
        <h5>🛠️ Skills</h5>
        <div id="skills-section">
           {% for skill in skills %}
            <div class="row g-2 align-items-center mb-2 skill-group">
                <div class="col-md-4">
                    <input type="text" class="form-control form-control-sm" name="skills" value="{{ skill.name }}" placeholder="Skill" required>
                </div>
                <div class="col-md-3">
                    <input type="number" class="form-control form-control-sm" name="rates" value="{{ skill.rate }}" placeholder="Rate ₹" required>
                </div>
                <div class="col-md-3">
                    <select class="form-select form-select-sm" name="rate_types" required>
                        <option value="per hour" {% if skill.rate_type == 'per hour' %}selected{% endif %}>₹/Hour</option>
                        <option value="per job" {% if skill.rate_type == 'per job' %}selected{% endif %}>₹/Job</option>
                        <option value="per kilo" {% if skill.rate_type == 'per kilo' %}selected{% endif %}>₹/Kilo</option>
                        <option value="per kilometer" {% if skill.rate_type == 'per kilometer' %}selected{% endif %}>₹/Kilometer</option>
                    </select>

                </div>
                <div class="col-md-2">
                    {% if not loop.first %}
                    <button type="button" class="btn btn-outline-danger btn-sm w-100" onclick="removeSkill(this)">❌ Remove</button>
                    {% endif %}
                </div>
            </div>
            {% endfor %}
        </div>
        <div>
            <button type="button" class="btn btn-outline-primary btn-sm" onclick="addSkill()">➕ Add Skill</button>
        </div>

        <hr class="my-4">
        <h5 class="mt-4">📸 Upload Media</h5>
        <div class="mb-3">
            <label>Showcase Images</label>
            <input type="file" class="form-control" name="showcase_images" accept="image/*" multiple>
        </div>
        <div class="mb-3">
            <label>Profile Video</label>
            <input type="file" class="form-control" name="video" accept="video/*">
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary w-100">💾 Update Profile</button>
        </div>
    </form>

    {% if profile.video %}
    <hr class="my-4">
    <h5>🎥 Current Video</h5>
    <video width="300" controls>
        <source src="{{ url_for('static', filename='uploads/' + profile.video) }}">
    </video>
    <form method="POST" action="{{ url_for('delete_media', media_type='video', media_id=profile.id) }}">
        <button type="submit" class="delete-btn">Delete Video</button>
    </form>
    {% endif %}

    {% if showcase_images %}
    <hr class="my-4">
    <h5>📷 Current Showcase Images</h5>
    <div class="d-flex flex-wrap gap-2">
        {% for img in showcase_images %}
        <div>
            <img src="{{ url_for('static', filename='uploads/' + img.image_url) }}" width="100" class="mb-1">
            <form method="POST" action="{{ url_for('delete_media', media_type='image', media_id=img.id) }}">
                <button type="submit" class="delete-btn">Delete Image</button>
            </form>
        </div>
        {% endfor %}
    </div>
    {% endif %}
</div>

<script>
function addSkill() {
    const container = document.getElementById('skills-section');
    const row = document.createElement('div');
    row.className = 'row g-2 align-items-center mb-2 skill-group';
    row.innerHTML = `
        <div class="col-md-4">
            <input type="text" name="skills" class="form-control form-control-sm" placeholder="Skill" required>
        </div>
        <div class="col-md-3">
            <input type="number" name="rates" class="form-control form-control-sm" placeholder="Rate ₹" required>
        </div>
        <div class="col-md-3">
            <select class="form-select form-select-sm" name="rate_types" required>
                <option value="per hour">₹/Hour</option>
                <option value="per job">₹/Job</option>
                <option value="per kilo">₹/Kilo</option>
                <option value="per kilometer">₹/Kilometer</option>
            </select>
        </div>
        <div class="col-md-2">
            <button type="button" class="btn btn-outline-danger btn-sm w-100" onclick="removeSkill(this)">❌ Remove</button>
        </div>
    `;
    container.appendChild(row);
}

function removeSkill(btn) {
    btn.closest('.skill-group').remove();
}

function previewImage(event) {
    const preview = document.getElementById('photo-preview');
    preview.src = URL.createObjectURL(event.target.files[0]);
    preview.onload = () => URL.revokeObjectURL(preview.src);
}
</script>
</body>
</html>
