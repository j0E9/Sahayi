<!DOCTYPE html>
<html lang="en">
<head>
    <title>Pay Token</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; padding: 50px; text-align: center; background-color: #f2f2f2; }
        h2 { color: #007bff; }
        #timer { font-size: 1.5em; color: green; }
    </style>
</head>
<body>
    <h2>🔒 Token Payment</h2>
    <p>You have <b id="timer">{{ time_left }}</b> seconds to pay the token.</p>
    <form method="POST">
        <button type="submit" class="btn btn-primary btn-lg mt-3">Pay Token Now</button>
    </form>

    <script>
        let seconds = {{ time_left }};
        const timer = document.getElementById('timer');
        const interval = setInterval(() => {
            seconds -= 1;
            if (seconds <= 0) {
                clearInterval(interval);
                timer.innerText = "Expired";
            } else {
                timer.innerText = seconds;
            }
        }, 1000);
    </script>
</body>
</html>
