<!DOCTYPE html>
<html>
<head><title>Live Location Tracker</title></head>
<body>
    <h2>Live GPS Tracker</h2>
    <p id="status">Fetching location...</p>

    <script>
        function updateLocation() {
            navigator.geolocation.getCurrentPosition(sendLocation, handleError, {
                enableHighAccuracy: true
            });
        }

        function sendLocation(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            document.getElementById("status").innerHTML =
                `Latitude: ${lat}<br>Longitude: ${lon}<br>
                <a href='https://www.google.com/maps?q=${lat},${lon}' target='_blank'>Open in Google Maps</a>`;

            fetch('/location', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({lat: lat, lon: lon})
            });
        }

        function handleError(error) {
            document.getElementById("status").innerText = "Error: " + error.message;
        }

        // Start updating location every 10 seconds
        setInterval(updateLocation, 10000);
        // Also update once immediately
        updateLocation();
    </script>
</body>
</html>
