<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome to Job Connect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #e0f7fa, #ffffff);
      color: #333;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .location-box, .notification-icon {
      position: fixed;
      z-index: 1000;
    }

    .location-box {
      top: 10px;
      left: 10px;
      background-color: #d7f0e3;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
      max-width: 80vw;
      word-wrap: break-word;
    }

    .notification-icon {
      top: 10px;
      right: 10px;
      font-size: 18px;
      text-decoration: none;
      color: black;
      background-color: #f0f0f0;
      padding: 8px 12px;
      border-radius: 20px;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
    }

    .token-box {
      position: fixed;
      top: 55px;
      right: 10px;
      background-color: #fff4e6;
      border: 1px solid #ffc107;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 14px;
      color: #856404;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      z-index: 999;
      font-weight: 500;
    }

    .hero {
      text-align: center;
      padding: 80px 20px 40px;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 600;
      color: #00695c;
    }

    .hero p {
      font-size: 1.2rem;
      color: #555;
    }

    .card-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
    }

    .option-card {
      background: white;
      padding: 30px 20px;
      border-radius: 16px;
      width: 250px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
      text-align: center;
    }

    .option-card:hover {
      transform: translateY(-8px);
    }

    .option-card a {
      text-decoration: none;
      color: #0077cc;
      font-weight: 500;
      font-size: 18px;
    }

    .logout-link {
      margin-top: 30px;
      display: inline-block;
      background-color: #f44336;
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 500;
      transition: background-color 0.3s;
    }

    .logout-link:hover {
      background-color: #d32f2f;
    }

    @media (max-width: 768px) {
      .location-box, .notification-icon, .token-box {
        font-size: 12px;
        padding: 6px 10px;
      }

      .option-card {
        width: 80%;
      }

      .token-box {
        top: 50px;
        right: 8px;
      }
    }
  </style>

  <script>
    async function fetchLocationAndUpdate() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async function (position) {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          localStorage.setItem('lastLatitude', latitude);
          localStorage.setItem('lastLongitude', longitude);

          const locationDetails = await fetch('/get_location_details', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ latitude, longitude })
          }).then(res => res.json());

          localStorage.setItem('lastState', locationDetails.state);
          localStorage.setItem('lastZipcode', locationDetails.zipcode);

          document.getElementById("location-display").textContent =
            `${locationDetails.state}, ${locationDetails.zipcode}`;

          await fetch('/update_location', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              latitude: latitude,
              longitude: longitude,
              state: locationDetails.state,
              zipcode: locationDetails.zipcode
            })
          });

        }, function (error) {
          console.error("Location error:", error);
          restoreLastLocation();
        });
      } else {
        console.log("Geolocation not supported.");
        restoreLastLocation();
      }
    }

    function restoreLastLocation() {
      const state = localStorage.getItem('lastState') || 'Unknown';
      const zipcode = localStorage.getItem('lastZipcode') || 'Unknown';
      document.getElementById("location-display").textContent = `${state}, ${zipcode}`;
    }

    setInterval(fetchLocationAndUpdate, 10000);
    window.onload = function () {
      restoreLastLocation();
      fetchLocationAndUpdate();
    };
  </script>
</head>
<body>
  <div class="location-box">
    📍 <b>Current Location:</b> <span id="location-display">Fetching...</span>
  </div>

  <a href="/notifications" class="notification-icon">🔔 {{ unread_count }}</a>

  <div class="token-box">
    🪙 <b>Tokens:</b> {{ current_user.tokens }}
  </div>

  <div class="hero">
    <h1>Welcome, {{ current_user.name }} 👋</h1>
    <p>Your gateway to finding and offering jobs nearby</p>

    <div class="card-options">
      <div class="option-card">
        <a href='/provide_job'>🛠️ Get a Sahayi</a>
      </div>
      <div class="option-card">
        <a href='/seek_job'>🤝 Be a Sahayi</a>
      </div>
    </div>

    <a href='/logout' class="logout-link">🚪 Logout</a>
  </div>
</body>
</html>
