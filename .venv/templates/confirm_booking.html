<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #f8f9fa, #e9ecef);
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
        }

        .form-container {
            background: #fff;
            padding: 30px;
            max-width: 650px;
            margin: auto;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h3 {
            color: #0d6efd;
            font-weight: bold;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-success {
            font-size: 18px;
            padding: 12px;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .btn-success:hover {
            background-color: #198754;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .form-control {
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
        }

        @media (max-width: 576px) {
            .form-container {
                padding: 20px;
            }

            .btn-success {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<div class="form-container">
    <h3 class="mb-4">📝 Book {{ worker.name }}</h3>

    <form id="bookingForm" method="POST">
        <!-- Selected Skill Display -->
        <div class="mb-4">
            <label class="form-label">Selected Skill</label>
            <p class="form-control-plaintext">
                <strong>{{ selected_skill.name.title() }}</strong> —
                ₹{{ selected_skill.rate }} / {{ selected_skill.rate_type }}
            </p>
            <!-- Hidden fields -->
            <input type="hidden" name="skill_id" value="{{ selected_skill.id }}">
            <input type="hidden" name="rate_type" id="rate_type" value="{{ selected_skill.rate_type }}">
            <input type="hidden" name="skill_name" id="skill_name" value="{{ selected_skill.name }}">
        </div>

        <!-- Job Description -->
        <div class="mb-4">
            <label class="form-label">Job Description</label>
            <textarea class="form-control" name="description" rows="4" placeholder="Brief description of the job" required></textarea>
        </div>

        <!-- Quantity Field (Dynamic) -->
        <div id="dynamicInput" class="mb-4"></div>

        <!-- Submit -->
        <button type="submit" class="btn btn-success w-100">✅ Confirm & Book</button>
    </form>
</div>

<!-- ✅ Toast Notification -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
  <div id="workerToast" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="toast-message">
        <!-- Message will go here -->
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS Logic -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("bookingForm");
    const rateType = document.getElementById('rate_type').value;
    const dynamicInput = document.getElementById('dynamicInput');
    let html = '';

    if (rateType === 'per hour') {
        html = `
            <label class="form-label">Duration</label>
            <div class="row g-2">
                <div class="col">
                    <input type="number" name="hours" min="0" max="24" class="form-control" placeholder="Hours" required>
                </div>
                <div class="col">
                    <input type="number" name="minutes" min="0" max="59" class="form-control" placeholder="Minutes" required>
                </div>
            </div>`;
    } else if (rateType === 'per job') {
        html = `<label class="form-label">Jobs</label>
                <input type="number" name="quantity" min="1" class="form-control" placeholder="e.g. 2 jobs" required>`;
    } else if (rateType === 'per kilo') {
        html = `<label class="form-label">Kilos</label>
                <input type="number" name="quantity" step="0.1" min="1" class="form-control" placeholder="e.g. 3.5 kg" required>`;
    } else if (rateType === 'per kilometer') {
        html = `<label class="form-label">Kilometers</label>
                <input type="number" name="quantity" step="0.1" min="1" class="form-control" placeholder="e.g. 10 km" required>`;
    } else {
        html = `<label class="form-label">Quantity</label>
                <input type="number" name="quantity" min="1" class="form-control" required>`;
    }

    dynamicInput.innerHTML = html;

    // ✅ AJAX form submit with offline check
    form.addEventListener("submit", async function (e) {
        e.preventDefault();
        const formData = new FormData(form);
        try {
            const response = await fetch(window.location.href, {
                method: "POST",
                body: formData
            });
            const result = await response.json();

            if (result.error === "offline") {
                // Show toast
                const toastEl = document.getElementById("workerToast");
                const toastBody = document.getElementById("toast-message");
                toastBody.textContent = result.message || "⚠️ Worker is currently offline.";
                const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
                toast.show();
                return;
            }

            if (result.redirect) {
                location.replace(result.redirect);
            }
        } catch (err) {
            alert("❌ Error submitting booking. Please try again.");
        }
    });
});
</script>

</body>
</html>
